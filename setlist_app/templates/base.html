<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111418">
  <title>{% block title %}{% endblock %}セットリスト管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">🎸 セトリ</a>
    {% if current_user.is_authenticated %}
      <nav class="nav">
        <a href="{{ url_for('setlists.index') }}">セトリ</a>
        <a href="{{ url_for('songs.index') }}">曲</a>
        <a href="{{ url_for('export.index') }}">CSV</a>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="link-button" type="submit">ログアウト</button>
        </form>
      </nav>
    {% endif %}
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash flash-{{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
