<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODOリスト</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.6rem; }
    form.add { display: flex; gap: 8px; margin-bottom: 24px; }
    form.add input { flex: 1; padding: 8px; font-size: 1rem; }
    button { padding: 6px 12px; font-size: 0.95rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
    li .title { flex: 1; }
    li.done .title { text-decoration: line-through; color: #999; }
    li form { margin: 0; }
    .empty { color: #888; }
  </style>
</head>
<body>
  <h1>TODOリスト</h1>

  <form class="add" action="{{ url_for('add') }}" method="post">
    <input name="title" placeholder="やることを入力" required autofocus>
    <button type="submit">追加</button>
  </form>

  {% if todos %}
  <ul>
    {% for todo in todos %}
    <li class="{{ 'done' if todo.done }}">
      <form action="{{ url_for('toggle', todo_id=todo.id) }}" method="post">
        <button type="submit">{{ '戻す' if todo.done else '完了' }}</button>
      </form>
      <span class="title">{{ todo.title }}</span>
      <form action="{{ url_for('delete', todo_id=todo.id) }}" method="post">
        <button type="submit">削除</button>
      </form>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="empty">タスクはまだありません。</p>
  {% endif %}
</body>
</html>
