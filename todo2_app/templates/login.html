{% extends "base.html" %}
{% block title %}ログイン - {% endblock %}
{% block content %}
  <section class="card narrow">
    <h1>ログイン</h1>
    <p class="muted">家族共通の合言葉を入力してください。</p>
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="password" name="password" placeholder="合言葉" autocomplete="current-password" required autofocus>
      <button type="submit" class="primary">ログイン</button>
    </form>
  </section>
{% endblock %}
