{% extends "base.html" %}
{% block title %}ログイン - {% endblock %}
{% block content %}
<h1>ログイン</h1>
<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>ユーザー名
    <input name="username" value="{{ username }}" autocomplete="username" autocapitalize="off" required>
  </label>
  <label>パスワード
    <input name="password" type="password" autocomplete="current-password" required>
  </label>
  <button class="button primary" type="submit">ログイン</button>
</form>
<p class="sub">はじめての方は <a href="{{ url_for('auth.register') }}">ユーザー登録</a></p>
{% endblock %}
