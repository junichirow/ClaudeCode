# game_app/ をサイトのトップに、game2_app/ を /game2/ に置いて GitHub Pages に公開する
name: GitHub Pages にゲームを公開

on:
  push:
    branches: [main]
    paths: ["game_app/**", "game2_app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 公開するファイルをまとめる
        run: |
          mkdir -p _site/game2
          cp -R game_app/. _site/
          cp -R game2_app/. _site/game2/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
